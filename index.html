<!doctype html><html lang="pt-MZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moz1Vendas — Administração</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a;font:14px Arial}header{background:#111827;color:#fff;padding:16px;position:sticky;top:0}h1{margin:0;font-size:21px}.sub{opacity:.75;font-size:12px}main{max-width:1200px;margin:auto;padding:12px}.panel,.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 9px #0001}input,button{font:inherit;padding:10px;border:1px solid #d1d5db;border-radius:9px}input{width:100%}button{background:#111827;color:#fff;border:0;font-weight:700}button.ok{background:#047857}button.danger{background:#b91c1c}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.kpi b{display:block;font-size:24px;margin-top:5px}.muted{color:#667085;font-size:12px}.tabs{display:flex;gap:6px;overflow:auto;margin:10px 0}.tabs button{white-space:nowrap}.tabs button.active{background:#2563eb}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions>*{flex:1 1 150px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px;border-bottom:1px solid #eee;vertical-align:top}th{background:#f8fafc}.status{padding:3px 7px;border-radius:20px;background:#eef2ff}.notice{padding:10px;border-radius:9px;margin-bottom:10px;background:#eef2ff}.err{background:#fef2f2;color:#991b1b}.ok{background:#ecfdf5;color:#065f46}.view{display:none}.view.active{display:block}.empty{text-align:center;padding:18px;color:#667085}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}table{display:block;overflow:auto;white-space:nowrap}}
</style></head><body>
<header><h1>Moz1Vendas — Administrador</h1><div class="sub">Painel administrativo</div></header><main>
<section class="panel"><input id="api" placeholder="URL do Web App GAS terminada em /exec"><br><br><input id="token" type="password" placeholder="ADMIN_API_TOKEN"><br><br><div class="actions"><button onclick="save()">Guardar e testar</button><button onclick="test()">Testar ligação</button></div><div id="notice" class="notice">Informe a URL e o ADMIN_API_TOKEN.</div></section>
<div class="tabs"><button class="active" onclick="tab('dash',this)">Dashboard</button><button onclick="tab('pend',this)">Pendentes</button><button onclick="tab('sell',this)">Vendedores</button><button onclick="tab('prod',this)">Produtos</button><button onclick="tab('sales',this)">Vendas</button></div>
<section id="dash" class="view active"><div id="kpi" class="grid"></div><div class="panel"><b>Alertas</b><div id="alerts"></div></div></section>
<section id="pend" class="view"><div class="panel"><b>Publicações pendentes</b><div id="pending"></div></div></section>
<section id="sell" class="view"><div class="panel"><input id="sq" placeholder="Pesquisar vendedor, empresa, telefone ou email"><br><br><button onclick="sellers()">Pesquisar</button><div id="seller"></div></div></section>
<section id="prod" class="view"><div class="panel"><input id="pq" placeholder="Pesquisar produto, loja ou categoria"><br><br><button onclick="products()">Pesquisar</button><div id="product"></div></div></section>
<section id="sales" class="view"><div class="panel"><input id="vq" placeholder="Pesquisar venda, produto, loja, telefone ou email"><br><br><button onclick="sales()">Pesquisar</button><div id="sale"></div></div></section>
</main><script>
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'''}[c])), money=x=>Number(x||0).toLocaleString('pt-MZ',{minimumFractionDigits:2})+' MT';
$('api').value=localStorage.getItem('m1v_admin_api')||'';$('token').value=sessionStorage.getItem('m1v_admin_token')||'';
function note(t,c=''){ $('notice').textContent=t;$('notice').className='notice '+c }
function cfg(){return {u:$('api').value.trim(),t:$('token').value.trim()}}
function save(){let c=cfg();if(!c.u||!c.t)return note('Preencha a URL e o ADMIN_API_TOKEN.','err');localStorage.setItem('m1v_admin_api',c.u);sessionStorage.setItem('m1v_admin_token',c.t);test()}
function json(t){try{return JSON.parse(String(t).replace(/^\uFEFF/,'').trim())}catch(_){let a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a)return JSON.parse(t.slice(a,b+1));throw Error('Resposta da API não é JSON válido.')}}
async function post(action,extra={}){
 let c=cfg();if(!c.u)throw Error('URL do Web App não informada.');if(!c.t)throw Error('ADMIN_API_TOKEN não informado.');
 let r;try{r=await fetch(c.u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,adminToken:c.t},extra)),cache:'no-store'})}catch(e){throw Error('Falha de comunicação com o Web App.')}
 let d=json(await r.text());if(!d.ok){let e=String(d.erro||'Erro da API');if(/Ação POST desconhecida/i.test(e))throw Error('O endpoint publicado não está a executar a versão do GAS que contém as funções administrativas.');throw Error(e)}return d
}
async function test(){try{note('A testar ligação...');await post('ADMIN_DASHBOARD');note('Ligação administrativa OK.','ok');dashboard()}catch(e){note(e.message,'err')}}
function tab(id,b){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='dash')dashboard();if(id==='pend')pending();if(id==='sell')sellers();if(id==='prod')products();if(id==='sales')sales()}
async function dashboard(){try{let d=await post('ADMIN_DASHBOARD'),x=d.dashboard||d,v=x.vendedores||{},p=x.produtos||{},s=x.vendas||{},o=x.payouts||{},a=x.alertas||{};$('kpi').innerHTML=[['Vendedores',v.total||0,'Pendentes '+(v.pendentes||0)],['Produtos',p.total||0,'Pendentes '+(p.pendentes||0)],['Vendas pagas',s.pagas||0,'Volume '+money(s.volumePago)],['Payouts',o.total||0,'Pendentes '+(o.pendentes||0)]].map(q=>'<div class="card kpi"><div class="muted">'+q[0]+'</div><b>'+q[1]+'</b><div class="muted">'+q[2]+'</div></div>').join('');$('alerts').innerHTML='<br>Vendedores pendentes: '+(a.vendedoresPendentes||0)+'<br>Produtos pendentes: '+(a.produtosPendentes||0)+'<br>Vendas pendentes: '+(a.vendasPendentes||0)+'<br>Vendas com erro: '+(a.vendasComErro||0)+'<br>Payouts pendentes: '+(a.payoutsPendentes||0)}catch(e){note(e.message,'err')}}
async function pending(){try{let v=await post('ADMIN_LISTAR_VENDEDORES',{status:'PENDENTE'}),p=await post('ADMIN_LISTAR_PRODUTOS',{status:'PENDENTE'}),r=[];(v.vendedores||[]).forEach(x=>r.push('<tr><td>Vendedor</td><td><b>'+esc(x.empresa)+'</b><br>'+esc(x.nome)+'</td><td>'+esc(x.vendedorId)+'</td><td><button class="ok" onclick="approveS(\''+esc(x.vendedorId)+'\')">Aprovar</button> <button class="danger" onclick="rejectS(\''+esc(x.vendedorId)+'\')">Rejeitar</button></td></tr>'));(p.produtos||[]).forEach(x=>r.push('<tr><td>Produto</td><td><b>'+esc(x.nome)+'</b><br>'+esc(x.empresa)+'</td><td>'+money(x.preco)+'</td><td><button class="ok" onclick="approveP(\''+esc(x.produtoId)+'\')">Activar</button> <button class="danger" onclick="rejectP(\''+esc(x.produtoId)+'\')">Rejeitar</button></td></tr>'));$('pending').innerHTML=r.length?'<table><tr><th>Tipo</th><th>Item</th><th>ID/Valor</th><th>Ações</th></tr>'+r.join('')+'</table>':'<div class="empty">Nenhuma publicação pendente.</div>'}catch(e){note(e.message,'err')}}
async function sellers(){try{let d=await post('ADMIN_LISTAR_VENDEDORES',{q:$('sq').value}),r=(d.vendedores||[]).map(x=>'<tr><td><b>'+esc(x.empresa)+'</b><br>'+esc(x.nome)+'</td><td>'+esc(x.telefone)+'<br>'+esc(x.email)+'</td><td>'+esc(x.status)+'</td><td>'+((x.financeiro||{}).vendasPagas||0)+' / '+money((x.financeiro||{}).vendasBrutas)+'</td><td>'+(x.status==='BLOQUEADO'?'<button class="ok" onclick="activateS(\''+esc(x.vendedorId)+'\')">Activar</button>':'<button class="danger" onclick="blockS(\''+esc(x.vendedorId)+'\')">Bloquear</button>')+'</td></tr>').join('');$('seller').innerHTML=r?'<table><tr><th>Loja</th><th>Contacto</th><th>Estado</th><th>Vendas</th><th>Ação</th></tr>'+r+'</table>':'<div class="empty">Nenhum vendedor.</div>'}catch(e){note(e.message,'err')}}
async function products(){try{let d=await post('ADMIN_LISTAR_PRODUTOS',{q:$('pq').value}),r=(d.produtos||[]).map(x=>'<tr><td>'+esc(x.nome)+'</td><td>'+esc(x.empresa)+'</td><td>'+money(x.preco)+'</td><td>'+esc(x.status)+'</td><td>'+(x.status==='BLOQUEADO'?'<button class="ok" onclick="activateP(\''+esc(x.produtoId)+'\')">Activar</button>':'<button class="danger" onclick="blockP(\''+esc(x.produtoId)+'\')">Bloquear</button>')+'</td></tr>').join('');$('product').innerHTML=r?'<table><tr><th>Produto</th><th>Loja</th><th>Preço</th><th>Estado</th><th>Ação</th></tr>'+r+'</table>':'<div class="empty">Nenhum produto.</div>'}catch(e){note(e.message,'err')}}
async function sales(){try{let d=await post('ADMIN_LISTAR_VENDAS',{q:$('vq').value}),r=(d.vendas||[]).map(x=>{let t='Saudações, '+x.empresa+'. A sua marca realizou uma venda do produto '+x.produto+', no valor de '+money(x.valorBruto)+'. Por favor, efectue a entrega do produto pago conforme as condições apresentadas no seu catálogo. Caso o produto seja digital e possua um link de download, a entrega poderá já ter sido realizada automaticamente. Obrigado por utilizar o Moz1Vendas.',w=x.clienteTelefone?'https://wa.me/'+String(x.clienteTelefone).replace(/\D/g,'')+'?text='+encodeURIComponent(t):'',m=x.clienteEmail?'mailto:'+x.clienteEmail+'?subject='+encodeURIComponent('Venda realizada — '+x.produto)+'&body='+encodeURIComponent(t):'';return '<tr><td>'+esc(x.vendaId)+'</td><td><b>'+esc(x.empresa)+'</b><br>'+esc(x.produto)+'</td><td>'+money(x.valorBruto)+'</td><td>'+esc(x.status)+'</td><td>'+(w?'<button onclick="window.open(\''+w+'\')">WhatsApp</button> ':'')+(m?'<button onclick="window.open(\''+m+'\')">Email</button>':'')+'</td></tr>'}).join('');$('sale').innerHTML=r?'<table><tr><th>Venda</th><th>Loja/produto</th><th>Valor</th><th>Estado</th><th>Contacto</th></tr>'+r+'</table>':'<div class="empty">Nenhuma venda.</div>'}catch(e){note(e.message,'err')}}
async function act(a,k,id,req){let m=req?prompt(req):'';if(req&&!m)return;try{await post(a,{[k]:id,motivo:m});note('Operação concluída.','ok');dashboard();pending()}catch(e){note(e.message,'err')}}
function approveS(id){act('ADMIN_APROVAR_VENDEDOR','vendedorId',id,'Motivo (opcional):')}function rejectS(id){act('ADMIN_REJEITAR_VENDEDOR','vendedorId',id,'Motivo obrigatório:')}function activateS(id){act('ADMIN_ATIVAR_VENDEDOR','vendedorId',id,'Motivo (opcional):')}function blockS(id){act('ADMIN_BLOQUEAR_VENDEDOR','vendedorId',id,'Motivo obrigatório:')}function approveP(id){act('ADMIN_APROVAR_PRODUTO','produtoId',id,'Motivo (opcional):')}function rejectP(id){act('ADMIN_REJEITAR_PRODUTO','produtoId',id,'Motivo obrigatório:')}function activateP(id){act('ADMIN_ATIVAR_PRODUTO','produtoId',id,'Motivo (opcional):')}function blockP(id){act('ADMIN_BLOQUEAR_PRODUTO','produtoId',id,'Motivo obrigatório:')}
if(cfg().u&&cfg().t)test();
</script></body></html>
