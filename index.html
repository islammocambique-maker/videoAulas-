<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moz1vendas - Marketplace de Moçambique</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: {
            brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 900: '#14532d' },
            accent: { 500: '#f59e0b', 600: '#d97706' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20 gap-4">
        
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 bg-gradient-to-tr from-brand-600 to-emerald-400 rounded-2xl flex items-center justify-center text-white text-2xl font-black shadow-lg shadow-brand-500/30">
            M1
          </div>
          <div>
            <span class="text-2xl font-extrabold bg-gradient-to-r from-slate-900 via-brand-700 to-slate-800 bg-clip-text text-transparent">Moz1vendas</span>
            <span class="block text-[10px] font-bold uppercase tracking-widest text-slate-400 -mt-1">Marketplace Digital</span>
          </div>
        </div>

        <!-- Botões de Ação -->
        <div class="flex items-center gap-3">
          <div id="sessaoVendedor" class="hidden items-center gap-2">
            <span id="nomeLojaSessao" class="text-xs font-bold text-slate-700"></span>
            <button onclick="openModal('modalAddProduto')" class="bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow">
              <i class="fa-solid fa-plus mr-1"></i> Adicionar Produto
            </button>
            <button onclick="terminarSessao()" class="text-xs text-red-500 hover:underline">Sair</button>
          </div>

          <div id="botoesVisitante" class="flex items-center gap-2">
            <button onclick="openModal('modalLogin')" class="bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-semibold px-4 py-3 rounded-full transition-all">
              <i class="fa-solid fa-right-to-bracket mr-1"></i> Entrar na Loja
            </button>
            <button onclick="openModal('modalRegistro')" class="bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold px-5 py-3 rounded-full transition-all shadow-md shadow-brand-500/20">
              <i class="fa-solid fa-store mr-1"></i> Criar Loja
            </button>
          </div>
        </div>

      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-12">
    <!-- BLOCOS DE EMPRESAS / LOJAS -->
    <section class="space-y-10" id="seccaoBlocosEmpresas">
      <!-- As lojas criadas vão ser renderizadas aqui dinamicamente -->
    </section>
  </main>

  <!-- MODAL REGISTO DE EMPRESA -->
  <div id="modalRegistro" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 space-y-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeModal('modalRegistro')" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      <div>
        <h3 class="text-xl font-extrabold text-slate-900">Registo de Empresa / Marca</h3>
        <p class="text-xs text-slate-500">Crie a sua loja e publique os seus produtos.</p>
      </div>
      <form id="formRegistro" onsubmit="submeterRegistro(event)" class="space-y-4 text-xs">
        <div>
          <label class="font-bold text-slate-700 block mb-1">Nome Completo</label>
          <input type="text" required id="regNome" class="w-full p-3 bg-slate-100 border rounded-xl outline-none">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="font-bold text-slate-700 block mb-1">E-mail</label>
            <input type="email" required id="regEmail" class="w-full p-3 bg-slate-100 border rounded-xl outline-none">
          </div>
          <div>
            <label class="font-bold text-slate-700 block mb-1">Contacto (WhatsApp)</label>
            <input type="tel" required id="regTelefone" placeholder="+258..." class="w-full p-3 bg-slate-100 border rounded-xl outline-none">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="font-bold text-slate-700 block mb-1">Nome da Empresa / Marca</label>
            <input type="text" required id="regEmpresa" class="w-full p-3 bg-slate-100 border rounded-xl outline-none">
          </div>
          <div>
            <label class="font-bold text-slate-700 block mb-1">Link do Logotipo</label>
            <input type="url" required id="regLogo" placeholder="https://..." class="w-full p-3 bg-slate-100 border rounded-xl outline-none">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="font-bold text-slate-700 block mb-1">Data de Nascimento</label>
            <input type="date" required id="regDataNasc" class="w-full p-3 bg-slate-100 border rounded-xl outline-none">
          </div>
          <div>
            <label class="font-bold text-slate-700 block mb-1">BI Nº</label>
            <input type="text" required id="regBI" class="w-full p-3 bg-slate-100 border rounded-xl outline-none">
          </div>
        </div>
        <div>
          <label class="font-bold text-slate-700 block mb-1">PIN de Acesso (4-6 dígitos)</label>
          <input type="password" required id="regPin" maxlength="6" class="w-full p-3 bg-slate-100 border rounded-xl outline-none">
        </div>
        <button type="submit" id="btnSubmitReg" class="w-full py-4 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow-lg transition-all text-sm">
          Criar Minha Empresa
        </button>
      </form>
    </div>
  </div>

  <!-- MODAL LOGIN -->
  <div id="modalLogin" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 space-y-6 shadow-2xl relative">
      <button onclick="closeModal('modalLogin')" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      <h3 class="text-xl font-extrabold text-slate-900">Entrar na Sua Loja</h3>
      <form onsubmit="submeterLogin(event)" class="space-y-4 text-xs">
        <div>
          <label class="font-bold text-slate-700 block mb-1">Contacto (WhatsApp)</label>
          <input type="tel" id="loginTelefone" required class="w-full p-3 bg-slate-100 border rounded-xl outline-none">
        </div>
        <div>
          <label class="font-bold text-slate-700 block mb-1">PIN de Acesso</label>
          <input type="password" id="loginPin" required maxlength="6" class="w-full p-3 bg-slate-100 border rounded-xl outline-none">
        </div>
        <button type="submit" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl transition-all">
          Aceder ao Painel
        </button>
      </form>
    </div>
  </div>

  <!-- MODAL ADICIONAR PRODUTO -->
  <div id="modalAddProduto" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 space-y-6 shadow-2xl relative">
      <button onclick="closeModal('modalAddProduto')" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      <h3 class="text-xl font-extrabold text-slate-900">Novo Produto</h3>
      <form onsubmit="submeterProduto(event)" class="space-y-4 text-xs">
        <div>
          <label class="font-bold text-slate-700 block mb-1">Nome do Produto</label>
          <input type="text" id="prodNome" required class="w-full p-3 bg-slate-100 border rounded-xl outline-none">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="font-bold text-slate-700 block mb-1">Preço (Mtn)</label>
            <input type="number" id="prodPreco" required class="w-full p-3 bg-slate-100 border rounded-xl outline-none">
          </div>
          <div>
            <label class="font-bold text-slate-700 block mb-1">Tipo de Produto</label>
            <select id="prodTipo" onchange="toggleLinkDigital(this.value)" class="w-full p-3 bg-slate-100 border rounded-xl outline-none">
              <option value="FISICO">Físico</option>
              <option value="DIGITAL">Digital</option>
            </select>
          </div>
        </div>
        <div>
          <label class="font-bold text-slate-700 block mb-1">URL da Imagem</label>
          <input type="url" id="prodImagem" required placeholder="https://..." class="w-full p-3 bg-slate-100 border rounded-xl outline-none">
        </div>
        <div id="divLinkDigital" class="hidden">
          <label class="font-bold text-slate-700 block mb-1">Link de Download / Ficheiro Digital</label>
          <input type="url" id="prodLinkDigital" placeholder="https://drive.google.com/..." class="w-full p-3 bg-slate-100 border rounded-xl outline-none">
        </div>
        <button type="submit" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow-lg transition-all">
          Publicar Produto
        </button>
      </form>
    </div>
  </div>

  <script>
    // Cole aqui o URL da sua Web App do Google Apps Script
    const GAS_URL = "SUA_WEB_APP_URL_AQUI";

    let lojas = [];
    let usuarioLogado = null;

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }
    function toggleLinkDigital(val) { document.getElementById('divLinkDigital').classList.toggle('hidden', val !== 'DIGITAL'); }

    // 1. SUBMETER REGISTO DE NOVA LOJA
    async function submeterRegistro(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitReg');
      btn.innerText = "A guardar no Google Sheets...";
      btn.disabled = true;

      const payload = {
        action: "CRIAR_LOJA",
        nome: document.getElementById('regNome').value,
        email: document.getElementById('regEmail').value,
        telefone: document.getElementById('regTelefone').value,
        empresa: document.getElementById('regEmpresa').value,
        logo: document.getElementById('regLogo').value,
        dataNasc: document.getElementById('regDataNasc').value,
        bi: document.getElementById('regBI').value,
        pin: document.getElementById('regPin').value
      };

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.status === "SUCCESS") {
          // Adiciona a nova loja na interface imediatamente
          const novaLoja = {
            vendedorId: result.vendedorId,
            empresa: payload.empresa,
            logo: payload.logo,
            produtosLoja: []
          };
          lojas.unshift(novaLoja);
          renderizarBlocos(lojas);

          // Efetua login automático
          usuarioLogado = { id: result.vendedorId, empresa: payload.empresa };
          atualizarEstadoSessao();

          alert("Loja registada com sucesso no Google Sheets!");
          closeModal('modalRegistro');
          document.getElementById('formRegistro').reset();
        } else {
          alert("Erro ao registar: " + result.message);
        }
      } catch (err) {
        alert("Falha na comunicação com o Google Sheets. Verifique a URL do GAS.");
      } finally {
        btn.innerText = "Criar Minha Empresa";
        btn.disabled = false;
      }
    }

    // 2. LOGIN DO VENDEDOR
    async function submeterLogin(e) {
      e.preventDefault();
      const payload = {
        action: "LOGIN",
        telefone: document.getElementById('loginTelefone').value,
        pin: document.getElementById('loginPin').value
      };

      try {
        const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
        const result = await res.json();

        if (result.status === "SUCCESS") {
          usuarioLogado = result.vendedor;
          atualizarEstadoSessao();
          closeModal('modalLogin');
          alert("Sessão iniciada como " + usuarioLogado.empresa);
        } else {
          alert("Credenciais inválidas.");
        }
      } catch (err) {
        alert("Erro no login.");
      }
    }

    // 3. ADICIONAR PRODUTO À LOJA LOGADA
    async function submeterProduto(e) {
      e.preventDefault();
      if (!usuarioLogado) return alert("Precisa de iniciar sessão.");

      const payload = {
        action: "CRIAR_PRODUTO",
        vendedorId: usuarioLogado.id,
        nome: document.getElementById('prodNome').value,
        preco: Number(document.getElementById('prodPreco').value),
        tipo: document.getElementById('prodTipo').value,
        imagem: document.getElementById('prodImagem').value,
        linkDigital: document.getElementById('prodLinkDigital').value
      };

      try {
        const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
        const result = await res.json();

        if (result.status === "SUCCESS") {
          // Atualiza a loja na interface
          const loja = lojas.find(l => l.vendedorId === usuarioLogado.id);
          if (loja) {
            loja.produtosLoja.push({
              id: result.idProduto,
              nome: payload.nome,
              preco: payload.preco,
              tipo: payload.tipo,
              img: payload.imagem,
              gosta: 0,
              naoGosta: 0
            });
            renderizarBlocos(lojas);
          }
          alert("Produto adicionado com sucesso!");
          closeModal('modalAddProduto');
        }
      } catch (err) {
        alert("Erro ao publicar produto.");
      }
    }

    function atualizarEstadoSessao() {
      if (usuarioLogado) {
        document.getElementById('botoesVisitante').classList.add('hidden');
        document.getElementById('sessaoVendedor').classList.remove('hidden');
        document.getElementById('sessaoVendedor').classList.add('flex');
        document.getElementById('nomeLojaSessao').innerText = usuarioLogado.empresa;
      } else {
        document.getElementById('botoesVisitante').classList.remove('hidden');
        document.getElementById('sessaoVendedor').classList.add('hidden');
      }
    }

    function terminarSessao() {
      usuarioLogado = null;
      atualizarEstadoSessao();
    }

    function renderizarBlocos(listaLojas) {
      const container = document.getElementById('seccaoBlocosEmpresas');
      if (listaLojas.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-400">Nenhuma loja registada ainda.</div>`;
        return;
      }
      container.innerHTML = listaLojas.map(b => `
        <div class="bg-white rounded-3xl border border-slate-200 p-6 space-y-6 shadow-sm">
          <div class="flex items-center justify-between flex-wrap gap-4 pb-4 border-b">
            <div class="flex items-center gap-4">
              <img src="${b.logo}" class="w-14 h-14 rounded-2xl object-cover ring-2 ring-brand-500/20 shadow-md">
              <div>
                <h3 class="text-lg font-bold text-slate-900">${b.empresa}</h3>
                <span class="text-xs text-slate-400">Loja Oficial Moz1vendas</span>
              </div>
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            ${b.produtosLoja.length === 0 ? '<p class="text-xs text-slate-400 col-span-3">Nenhum produto publicado nesta loja.</p>' : ''}
            ${b.produtosLoja.map(p => `
              <div class="bg-slate-50/50 rounded-2xl p-4 border space-y-3">
                <img src="${p.img}" class="w-full h-44 object-cover rounded-xl">
                <h4 class="font-bold text-sm text-slate-800">${p.nome}</h4>
                <p class="text-brand-700 font-black">${p.preco.toLocaleString()} Mtn</p>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
