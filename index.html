<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moz1vendas - Marketplace & Vitrine Digital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    :root {
      --primary-color: #0d6efd;
      --bg-light: #f8f9fa;
    }
    body {
      background-color: var(--bg-light);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .hero-banner {
      background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
      color: white;
      padding: 2.5rem 1rem;
      border-radius: 0 0 20px 20px;
    }
    .product-card {
      border: none;
      border-radius: 12px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    .product-img {
      height: 180px;
      object-fit: cover;
      border-radius: 12px 12px 0 0;
    }
    .store-logo {
      width: 45px;
      height: 45px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid white;
    }
    .badge-price {
      font-size: 1.1rem;
      font-weight: 700;
      color: #198754;
    }
  </style>
</head>
<body>

  <!-- Navegação Principal -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#"><i class="bi bi-shop me-2"></i>Moz1vendas</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item">
            <a class="nav-link active" href="#" onclick="carregarVitrineHome()"><i class="bi bi-house me-1"></i> Início</a>
          </li>
          <li class="nav-item">
            <button class="btn btn-outline-light ms-lg-2 my-2 my-lg-0" data-bs-toggle="modal" data-bs-target="#modalAuth">
              <i class="bi bi-person-circle me-1"></i> Minha Conta
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Cabeçalho Hero -->
  <div class="hero-banner text-center mb-4">
    <div class="container">
      <h1 class="fw-bold">Compre e Venda com Segurança</h1>
      <p class="lead mb-0">Produtos digitais e físicos dos melhores vendedores de Moçambique</p>
    </div>
  </div>

  <!-- Conteúdo Principal -->
  <main class="container mb-5">
    
    <!-- Filtro de Categorias -->
    <div class="d-flex overflow-auto pb-3 mb-4 gap-2" id="categoriasContainer">
      <button class="btn btn-primary rounded-pill px-3 active" onclick="filtrarCategoria('')">Todas</button>
      <button class="btn btn-outline-primary rounded-pill px-3" onclick="filtrarCategoria('DIGITAL')">Digitais</button>
      <button class="btn btn-outline-primary rounded-pill px-3" onclick="filtrarCategoria('FISICO')">Físicos</button>
      <button class="btn btn-outline-primary rounded-pill px-3" onclick="filtrarCategoria('GERAL')">Geral</button>
    </div>

    <!-- Indicador de Carregamento -->
    <div id="loading" class="text-center my-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted">A carregar produtos...</p>
    </div>

    <!-- Container das Lojas e Produtos -->
    <div id="vitrineContainer" class="row g-4"></div>
  </main>

  <!-- Modal de Compra / Pagamento -->
  <div class="modal fade" id="modalCheckout" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Finalizar Compra</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <div id="checkoutInfo" class="mb-3 p-3 bg-light rounded"></div>
          <form id="formCheckout" onsubmit="processarCompra(event)">
            <input type="hidden" id="checkoutProdutoId">
            <div class="mb-3">
              <label class="form-label">Seu Número M-Pesa / Carteira Mobile</label>
              <div class="input-group">
                <span class="input-group-text">+258</span>
                <input type="tel" class="form-control" id="checkoutTelefone" placeholder="841234567" requiredPattern="8[2-7]\d{7}">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Método de Pagamento</label>
              <select class="form-select" id="checkoutMetodo">
                <option value="mpesa">M-Pesa</option>
                <option value="emola">e-Mola</option>
              </select>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 fw-bold" id="btnPagar">
              Confirmar e Pagar
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Autenticação (Login / Registo) -->
  <div class="modal fade" id="modalAuth" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Área do Vendedor</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <ul class="nav nav-pills nav-justified mb-3" id="authTab" role="tablist">
            <li class="nav-item">
              <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabLogin">Entrar</button>
            </li>
            <li class="nav-item">
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabRegisto">Criar Loja</button>
            </li>
          </ul>
          <div class="tab-content">
            <!-- Formulário Login -->
            <div class="tab-pane fade show active" id="tabLogin">
              <form onsubmit="executarLogin(event)">
                <div class="mb-3">
                  <label class="form-label">Telefone</label>
                  <input type="tel" class="form-control" id="loginTelefone" placeholder="841234567" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">PIN / Senha</label>
                  <input type="password" class="form-control" id="loginPin" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar na Loja</button>
              </form>
            </div>
            <!-- Formulário Registo -->
            <div class="tab-pane fade" id="tabRegisto">
              <form onsubmit="executarRegisto(event)">
                <div class="mb-3">
                  <label class="form-label">Nome do Proprietário</label>
                  <input type="text" class="form-control" id="regNome" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Nome da Loja / Empresa</label>
                  <input type="text" class="form-control" id="regEmpresa" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Telefone</label>
                  <input type="tel" class="form-control" id="regTelefone" placeholder="841234567" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">PIN de Segurança (4-6 dígitos)</label>
                  <input type="password" class="form-control" id="regPin" maxlength="6" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Criar Minha Loja</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // URL da sua implantação (Web App Executável do Apps Script)
    const API_URL = 'https://script.google.com/macros/s/AKfycbylXMOOSJo3iFnuY5vqMl2XfvDwfUErBIYv9VeKltAUNlzA6YAASVX5WE9wFqyOPkzrDg/exec';

    document.addEventListener("DOMContentLoaded", () => {
      carregarVitrineHome();
    });

    async function carregarVitrineHome() {
      exibirLoading(true);
      try {
        const res = await fetch(`${API_URL}?action=homeBlocos`);
        const json = await res.json();
        
        if (json.ok && json.data && json.data.blocos) {
          renderizarBlocos(json.data.blocos);
        } else {
          exibirErro('Não foi possível carregar os produtos.');
        }
      } catch (err) {
        exibirErro('Erro de conexão ao carregar a vitrine.');
      } finally {
        exibirLoading(false);
      }
    }

    function renderizarBlocos(blocos) {
      const container = document.getElementById('vitrineContainer');
      container.innerHTML = '';

      if (blocos.length === 0) {
        container.innerHTML = '<div class="text-center text-muted my-5">Nenhum produto disponível no momento.</div>';
        return;
      }

      blocos.forEach(bloco => {
        bloco.produtos.forEach(p => {
          const col = document.createElement('div');
          col.className = 'col-6 col-md-4 col-lg-3';
          col.innerHTML = `
            <div class="card product-card h-100 shadow-sm">
              <img src="${p.imagemUrl || 'https://via.placeholder.com/300'}" class="card-img-top product-img" alt="${p.nome}">
              <div class="card-body d-flex flex-column">
                <div class="d-flex align-items-center mb-2">
                  <span class="badge bg-secondary me-auto">${p.tipo}</span>
                  <small class="text-muted"><i class="bi bi-hand-thumbs-up"></i> ${p.gosta}</small>
                </div>
                <h6 class="card-title fw-bold text-truncate">${p.nome}</h6>
                <p class="badge-price mb-2">${p.preco} MZN</p>
                <button class="btn btn-primary btn-sm mt-auto w-100" onclick="abrirCheckout('${p.produtoId}', '${p.nome}', ${p.preco})">
                  Comprar
                </button>
              </div>
            </div>
          `;
          container.appendChild(col);
        });
      });
    }

    function abrirCheckout(id, nome, preco) {
      document.getElementById('checkoutProdutoId').value = id;
      document.getElementById('checkoutInfo').innerHTML = `
        <div class="fw-bold">${nome}</div>
        <div class="text-success fs-5 fw-bold">${preco} MZN</div>
      `;
      const modal = new bootstrap.Modal(document.getElementById('modalCheckout'));
      modal.show();
    }

    async function processarCompra(e) {
      e.preventDefault();
      const btn = document.getElementById('btnPagar');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>A Processar...';

      const payload = {
        action: 'COMPRAR_PRODUTO',
        produtoId: document.getElementById('checkoutProdutoId').value,
        telefone: document.getElementById('checkoutTelefone').value,
        metodo: document.getElementById('checkoutMetodo').value
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const json = await res.json();

        if (json.ok) {
          alert('Pagamento iniciado! Verifique a mensagem do M-Pesa no seu telemóvel para confirmar o PIN.');
          bootstrap.Modal.getInstance(document.getElementById('modalCheckout')).hide();
        } else {
          alert('Erro ao processar: ' + json.message);
        }
      } catch (err) {
        alert('Falha ao comunicar com o servidor.');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Confirmar e Pagar';
      }
    }

    async function filtrarCategoria(categoria) {
      exibirLoading(true);
      try {
        const url = categoria 
          ? `${API_URL}?action=produtosPorCategoria&categoria=${encodeURIComponent(categoria)}`
          : `${API_URL}?action=homeBlocos`;
          
        const res = await fetch(url);
        const json = await res.json();

        if (categoria) {
          renderizarListaProdutos(json.data ? json.data.produtos : []);
        } else {
          renderizarBlocos(json.data ? json.data.blocos : []);
        }
      } catch (err) {
        exibirErro('Erro ao filtrar produtos.');
      } finally {
        exibirLoading(false);
      }
    }

    function renderizarListaProdutos(produtos) {
      const container = document.getElementById('vitrineContainer');
      container.innerHTML = '';
      
      if (!produtos || produtos.length === 0) {
        container.innerHTML = '<div class="text-center text-muted my-5">Nenhum produto encontrado nesta categoria.</div>';
        return;
      }

      produtos.forEach(p => {
        const col = document.createElement('div');
        col.className = 'col-6 col-md-4 col-lg-3';
        col.innerHTML = `
          <div class="card product-card h-100 shadow-sm">
            <img src="${p.imagemUrl || 'https://via.placeholder.com/300'}" class="card-img-top product-img" alt="${p.nome}">
            <div class="card-body d-flex flex-column">
              <h6 class="card-title fw-bold text-truncate">${p.nome}</h6>
              <p class="badge-price mb-2">${p.preco} MZN</p>
              <button class="btn btn-primary btn-sm mt-auto w-100" onclick="abrirCheckout('${p.produtoId}', '${p.nome}', ${p.preco})">
                Comprar
              </button>
            </div>
          </div>
        `;
        container.appendChild(col);
      });
    }

    function exibirLoading(exibir) {
      document.getElementById('loading').style.display = exibir ? 'block' : 'none';
      if (exibir) document.getElementById('vitrineContainer').innerHTML = '';
    }

    function exibirErro(msg) {
      document.getElementById('vitrineContainer').innerHTML = `<div class="alert alert-danger text-center w-100">${msg}</div>`;
    }
  </script>
</body>
</html>
