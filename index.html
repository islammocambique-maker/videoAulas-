<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moz1Vendas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f4f4f9; padding: 15px; }

    /* Layout do Cabeçalho e Botões */
    header { display: flex; justify-content: space-between; align-items: center; max-width: 800px; margin: 0 auto 20px auto; padding: 10px; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .logo-app { font-weight: bold; font-size: 18px; color: #046A38; }

    /* Modais */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
    .modal-content { background: #fff; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; position: relative; }
    .close-btn { position: absolute; right: 15px; top: 10px; cursor: pointer; font-size: 20px; }
    
    /* Grade de Lojas */
    .lojas-container { display: flex; flex-direction: column; gap: 20px; max-width: 800px; margin: 0 auto; min-height: 200px; }
    .card-loja { background: #fff; border-radius: 10px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header-loja { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
    .info-loja { display: flex; align-items: center; gap: 10px; }
    .logo-loja { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
    
    /* Slideshow */
    .slideshow-container { position: relative; width: 100%; height: 250px; overflow: hidden; border-radius: 8px; background: #eaedf1; }
    .slide-item { display: none; width: 100%; height: 100%; text-align: center; }
    .slide-item.active { display: block; }
    .slide-item img { width: 100%; height: 180px; object-fit: cover; }
    .slide-details { padding: 5px; background: #fff; }
    
    /* Estado Vazio ou Mensagens */
    .mensagem-alerta { text-align: center; padding: 40px 20px; background: #fff; border-radius: 8px; color: #555; }

    /* Botões e Formulários */
    .btn { background: #046A38; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; }
    .btn-header { background: #046A38; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
    .btn-rec { background: #f0a500; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    input { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- Topo da Aplicação -->
  <header>
    <div class="logo-app">Moz1Vendas</div>
    <button class="btn-header" onclick="abrirModal('modalRegistro')">+ Criar Loja</button>
  </header>

  <!-- Modal de Registro de Loja -->
  <div id="modalRegistro" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="fecharModal('modalRegistro')">&times;</span>
      <h3>Registrar Nova Loja</h3>
      <form id="formRegistro">
        <input type="text" id="regNome" placeholder="Nome do Proprietário" required>
        <input type="text" id="regEmpresa" placeholder="Nome da Loja / Empresa" required>
        <input type="tel" id="regTelefone" placeholder="Telefone (8X / +258)" required>
        <input type="password" id="regPin" placeholder="PIN (4 a 6 dígitos)" maxlength="6" required>
        <button type="submit" class="btn">Cadastrar Loja</button>
      </form>
    </div>
  </div>

  <!-- Modal de Recomendação da Marca -->
  <div id="modalRecomendacao" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="fecharModal('modalRecomendacao')">&times;</span>
      <h3>Recomendar Marca</h3>
      <input type="hidden" id="recVendedorId">
      <p>Você recomenda esta loja?</p>
      <button class="btn" onclick="enviarRecomendacao('GOSTO')">👍 Recomendar (Gosto)</button>
      <button class="btn" style="background:#c0392b;" onclick="enviarRecomendacao('NAO_GOSTO')">👎 Não Recomendar</button>
    </div>
  </div>

  <!-- Container Principal das Lojas -->
  <main class="lojas-container" id="containerLojas">
    <div class="mensagem-alerta">Carregando lojas e produtos...</div>
  </main>

  <script>
    // IMPORTANTE: Insira a URL do seu Web App implantado no Google Apps Script aqui
    const GAS_URL = "https://script.google.com/macros/s/SEU_SCRIPT_ID/exec";

    document.addEventListener("DOMContentLoaded", () => {
      carregarBlocosHome();

      document.getElementById("formRegistro").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const payload = {
          action: "CRIAR_LOJA",
          nome: document.getElementById("regNome").value,
          empresa: document.getElementById("regEmpresa").value,
          telefone: document.getElementById("regTelefone").value,
          pin: document.getElementById("regPin").value
        };

        try {
          const res = await fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          
          if (data.ok) {
            alert(data.message || "Loja cadastrada com sucesso!");
            fecharModal("modalRegistro");
            carregarBlocosHome();
          } else {
            alert("Erro no registo: " + (data.message || "Ação não processada."));
          }
        } catch (err) {
          alert("Erro ao conectar com o servidor.");
        }
      });
    });

    async function carregarBlocosHome() {
      const container = document.getElementById("containerLojas");
      
      if (!GAS_URL || GAS_URL.includes("SEU_SCRIPT_ID")) {
        container.innerHTML = `<div class="mensagem-alerta"><strong>Atenção:</strong> Insira a URL válida do seu Web App no código JavaScript.</div>`;
        return;
      }

      try {
        const res = await fetch(`${GAS_URL}?action=homeBlocos`);
        const result = await res.json();

        if (result.ok && result.data && result.data.blocos && result.data.blocos.length > 0) {
          renderizarBlocos(result.data.blocos);
        } else {
          container.innerHTML = `
            <div class="mensagem-alerta">
              <h3>Nenhuma loja encontrada</h3>
              <p style="margin-top: 8px;">Ainda não existem lojas cadastradas na plataforma.</p>
              <button class="btn-header" style="margin-top: 15px;" onclick="abrirModal('modalRegistro')">Cadastrar Primeira Loja</button>
            </div>`;
        }
      } catch (err) {
        console.error("Erro na busca dos dados:", err);
        container.innerHTML = `<div class="mensagem-alerta">Erro ao carregar lojas. Verifique a conexão ou a URL do Apps Script.</div>`;
      }
    }

    function renderizarBlocos(blocos) {
      const container = document.getElementById("containerLojas");
      container.innerHTML = "";

      blocos.forEach((bloco, bIndex) => {
        const card = document.createElement("div");
        card.className = "card-loja";

        let slidesHTML = "";
        const produtos = bloco.produtos || [];

        if (produtos.length > 0) {
          produtos.forEach((prod, pIndex) => {
            slidesHTML += `
              <div class="slide-item slide-block-${bIndex} ${pIndex === 0 ? 'active' : ''}">
                <img src="${prod.imagemUrl || 'https://via.placeholder.com/300?text=Sem+Imagem'}" alt="${prod.nome}">
                <div class="slide-details">
                  <strong>${prod.nome}</strong>
                  <p>${prod.preco} MZN</p>
                </div>
              </div>
            `;
          });
        } else {
          slidesHTML = `<div class="slide-item active"><div class="slide-details" style="padding: 50px 0;">Esta loja ainda não possui produtos.</div></div>`;
        }

        card.innerHTML = `
          <div class="header-loja">
            <div class="info-loja">
              <img class="logo-loja" src="${bloco.logo || 'https://via.placeholder.com/50?text=Loja'}" alt="Logo">
              <div>
                <h4>${bloco.empresa || bloco.nomeVendedor || 'Loja Sem Nome'}</h4>
                <small>👍 ${(bloco.reputacao && bloco.reputacao.recomendacao) ? bloco.reputacao.recomendacao : 0}% de recomendações</small>
              </div>
            </div>
            <button class="btn-rec" onclick="abrirModalRecomendacao('${bloco.vendedorId || ''}')">⭐ Recomendar</button>
          </div>
          <div class="slideshow-container">
            ${slidesHTML}
          </div>
        `;

        container.appendChild(card);
        if (produtos.length > 1) {
          iniciarSlideshow(bIndex, produtos.length);
        }
      });
    }

    function iniciarSlideshow(blocoIndex, totalSlides) {
      let currentIndex = 0;
      setInterval(() => {
        const slides = document.querySelectorAll(`.slide-block-${blocoIndex}`);
        if (slides.length > 0) {
          slides[currentIndex].classList.remove("active");
          currentIndex = (currentIndex + 1) % totalSlides;
          slides[currentIndex].classList.add("active");
        }
      }, 6000);
    }

    function abrirModal(id) {
      document.getElementById(id).style.display = "flex";
    }

    function fecharModal(id) {
      document.getElementById(id).style.display = "none";
    }

    function abrirModalRecomendacao(vendedorId) {
      document.getElementById("recVendedorId").value = vendedorId;
      abrirModal("modalRecomendacao");
    }

    async function enviarRecomendacao(tipo) {
      const vendedorId = document.getElementById("recVendedorId").value;
      const payload = {
        action: "AVALIAR_EMPRESA",
        vendedorId: vendedorId,
        tipo: tipo
      };

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.ok) {
          alert("Recomendação registrada!");
          fecharModal("modalRecomendacao");
          carregarBlocosHome();
        } else {
          alert(data.message || "Erro ao registrar recomendação.");
        }
      } catch (err) {
        alert("Erro na comunicação com o servidor.");
      }
    }
  </script>
</body>
</html>
